name: Bug report / Hata bildirimi
description: Something does not work as documented. / Bir şey belgelendiği gibi çalışmıyor.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The boxes contain hidden hints and commands (`<!-- ... -->`), invisible after posting.
        Kutularda gizli ipuçları ve komutlar var, gönderince görünmezler.

        **Remove real coordinates, Wi-Fi names and passwords from everything you paste.**
        **Yapıştırdığın her şeyden gerçek koordinatları, Wi-Fi adlarını ve şifreleri sil.**

        Not sure if it's a bug? Check [Troubleshooting](https://github.com/ramazansancar/overlays-server#troubleshooting) / [Sorun giderme](https://github.com/ramazansancar/overlays-server/blob/master/README-tr.md#sorun-giderme) first.

        **Please attach a diagnostics file / Lütfen tanı dosyasını ekle:** open http://127.0.0.1:3456 → **Download diagnostics /
        Tanı verisini indir**, then drag the `.json` file into the box below. It holds the last ~2 minutes of raw device data
        and logs, so we can replay the problem. Secrets are removed; your position only if you tick the box.

  - type: textarea
    id: what
    attributes:
      label: What happened? / Ne oldu?
      value: |
        <!-- What did you expect, what happened instead? / Ne bekliyordun, ne oldu? -->
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Nasıl tekrarlanır?
      value: |
        1.
        2.
        3.
        <!-- Does it also happen without the camera? Try: npx overlays-server@latest --simulate
             Kamerasız da oluyor mu? Dene: npx overlays-server@latest --simulate -->

  - type: input
    id: version
    attributes:
      label: overlays-server version
      description: "`overlays-server --version`, `npx overlays-server@latest --version`, or the status page header."
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed via / Kurulum
      options:
        - npx / npm -g
        - git clone (npm start / start.cmd)
        - Programmatic (import)
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment / Ortam
      value: |
        <!--
        Fill in, or run these and paste the output: / Doldur ya da şunları çalıştırıp çıktıyı yapıştır:
          node --version
          npx overlays-server@latest --version
          OBS: Help → About / Yardım → Hakkında
          Windows (PowerShell): (Get-CimInstance Win32_OperatingSystem).Caption
        -->
        OS:
        Node.js:
        OBS:
        Device + firmware / Cihaz + firmware:
    validations:
      required: true

  - type: textarea
    id: network
    attributes:
      label: Network check (connection problems) / Ağ kontrolü (bağlantı sorunları)
      description: Optional. / İsteğe bağlı.
      value: |
        <!--
        PowerShell, with the PC on the camera Wi-Fi (replace 193.168.0.1 with your camera IP):
          Test-NetConnection 193.168.0.1 -Port 6100 | Select-Object TcpTestSucceeded
          Find-NetRoute -RemoteIPAddress 193.168.0.1 | Select-Object -First 1 InterfaceAlias
          Get-NetIPInterface -AddressFamily IPv4 | Sort-Object InterfaceMetric | Format-Table InterfaceAlias, InterfaceMetric, ConnectionState
        Server reachable from this PC:
          curl.exe -s http://127.0.0.1:3456/health
          curl.exe -s http://127.0.0.1:3456/v1/state      (contains your position: mask lat/lon before posting)
        -->
        ```text

        ```

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file / Tanı dosyası
      description: Drag & drop the .json here (if GitHub refuses the extension, rename it to .txt). / .json dosyasını buraya sürükle (uzantı kabul edilmezse .txt yap).
      value: |
        <!--
        http://127.0.0.1:3456 → "Tanı verisini indir" / "Download diagnostics"
        or / ya da:  curl.exe -o diagnostics.json http://127.0.0.1:3456/v1/diagnostics
        Tick "include my position" only for map / position problems. / Konumu sadece harita/konum sorunlarında dahil et.
        -->

  - type: textarea
    id: logs
    attributes:
      label: Logs / Log dosyası
      value: |
        <!--
        Best: attach the day's log file (drag & drop; rename to .txt if refused). En iyisi: o günün log dosyasını ekle.
          start.cmd: logsoverlays-server-YYYY-MM-DD.log next to start.cmd / start.cmd'nin yanındaki logs klasörü
          npm / npx: %APPDATA%overlays-serverlogs  (Linux / macOS: ~/.config/overlays-server/logs)
        Or paste the console:
        npx overlays-server@latest --log-level debug      (git: npm start -- --log-level debug)
        For overlay problems in OBS: Help → Log Files → View Current Log, search for "overlays" or "WebSocket".
        OBS: Yardım → Günlük Dosyaları → Geçerli Günlüğü Görüntüle.
        -->
        ```text

        ```

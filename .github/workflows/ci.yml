name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit, integration and process-level end-to-end tests (CLI; start.cmd on Windows).
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Smoke test the built CLI
        run: node dist/cli.js --version
      - name: Check the npm package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm pack --dry-run
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm audit --prod

  e2e:
    name: Browser tests (status page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
